<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Context Space</title></head><body><header><div class="mark">CS</div><div><strong>Context Space</strong><span id="connection">Connecting…</span></div></header><main><section id="setup" hidden><h1>Connect desktop app</h1><p>Copy the bridge token from the Context Space dashboard.</p><label>Bridge token<input id="token" autocomplete="off" spellcheck="false"></label><button id="save-token">Connect</button></section><section id="controls" hidden><div class="active-label">CURRENT WORKSPACE</div><h1 id="active">No active workspace</h1><label>Add tabs to<select id="workspace"></select></label><div class="actions"><button id="add-current">Add current tab</button><button id="load-tabs" class="secondary">Choose open tabs</button></div><div id="tabs" hidden><div class="tab-heading"><strong>Open tabs</strong><button id="select-all" class="link">Select all</button></div><div id="tab-list"></div><button id="add-selected">Add selected tabs</button></div></section><p id="message" role="status"></p></main><script type="module" src="popup.js"></script></body></html>
